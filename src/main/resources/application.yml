server:
  port: 8080

spring:
  application:
    name: distributed-monitoring
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true

  # ----- База данных (по умолчанию H2 file-mode) ---------------------------
  # Файл БД: ./data/monitoring.mv.db. Чтобы открыть консоль H2 — /h2-console
  # (включается профилем dev). PostgreSQL включается профилем postgres.
  datasource:
    url: jdbc:h2:file:./data/monitoring;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      # update — для PoC удобно: схема создаётся и подхватывает индексы из @Index.
      # В проде — миграции (Flyway/Liquibase).
      ddl-auto: update
    properties:
      hibernate:
        # H2 диалект по умолчанию; для Postgres переопределяется в профиле.
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false

  h2:
    console:
      enabled: true        # включена по умолчанию — http://localhost:8080/h2-console
      path: /h2-console

  # ----- SMTP для email-уведомлений ----------------------------------------
  # По умолчанию ничего не настроено — приложение стартует, но email-канал
  # будет тихо пропускаться. Переопределите через env-переменные:
  #   SPRING_MAIL_HOST=smtp.yandex.ru
  #   SPRING_MAIL_PORT=587
  #   SPRING_MAIL_USERNAME=alerts@mydomain.ru
  #   SPRING_MAIL_PASSWORD=xxxxx
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true

# ----- Прикладные настройки -----------------------------------------------
app:
  # Внешний URL приложения (используется в ссылках из уведомлений)
  public-url: ${APP_PUBLIC_URL:}
  jwt:
    # ВНИМАНИЕ: смените секрет в продакшене (мин. 32 символа для HS256).
    # На проде задавайте через переменную окружения APP_JWT_SECRET.
    secret: ${APP_JWT_SECRET:change-me-please-and-make-this-very-long-monitoring-secret-key}
    ttl-seconds: 86400   # 24 часа
  bootstrap-admin:
    enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:true}
    username: ${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:admin123}
  metrics:
    # raw retention — сколько хранить сырые точки. По умолч. 24 ч — этого
    # достаточно, чтобы успел отработать downsampler.
    retention-hours: ${APP_METRICS_RETENTION_HOURS:24}
    # downsampling
    downsample-lookback-hours: ${APP_METRICS_DOWNSAMPLE_LOOKBACK_HOURS:24}
    downsample-maturity-minutes: ${APP_METRICS_DOWNSAMPLE_MATURITY_MINUTES:10}
    downsample-retention-hours: ${APP_METRICS_DOWNSAMPLE_RETENTION_HOURS:720}  # 30 дней
  notifications:
    telegram:
      # Создайте бота у @BotFather и вставьте сюда (или в env TELEGRAM_BOT_TOKEN)
      bot-token: ${TELEGRAM_BOT_TOKEN:}
    email:
      # Адрес отправителя (From:) в исходящих письмах
      from: ${EMAIL_FROM:}

logging:
  level:
    root: INFO
    ru.diplom.monitoring: DEBUG
    org.springframework.security: INFO

# =========================================================================
# Профили
# =========================================================================
---
spring:
  config:
    activate:
      on-profile: dev
  h2:
    console:
      enabled: true
  # отключаем кеш static-ресурсов, иначе браузер показывает старый HTML/JS
  # после правок: для разработки это важнее, чем лишние HTTP-хеддеры.
  web:
    resources:
      cache:
        period: 0
        cachecontrol:
          no-store: true
  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: true

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/monitoring}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:monitoring}
    password: ${SPRING_DATASOURCE_PASSWORD:monitoring}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
app:
  bootstrap-admin:
    enabled: false
