server:
  port: 8080

spring:
  application:
    name: distributed-monitoring
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true

  # ----- База данных (по умолчанию H2 file-mode) ---------------------------
  # Файл БД: ./data/monitoring.mv.db. Чтобы открыть консоль H2 — /h2-console
  # (включается профилем dev). PostgreSQL включается профилем postgres.
  datasource:
    url: jdbc:h2:file:./data/monitoring;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      # update — для PoC удобно: схема создаётся и подхватывает индексы из @Index.
      # В проде — миграции (Flyway/Liquibase).
      ddl-auto: update
    properties:
      hibernate:
        # H2 диалект по умолчанию; для Postgres переопределяется в профиле.
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false

  h2:
    console:
      enabled: true        # включена по умолчанию — http://localhost:8080/h2-console
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true

# ----- Прикладные настройки -----------------------------------------------
app:
  jwt:
    # ВНИМАНИЕ: смените секрет в продакшене (мин. 32 символа для HS256)
    secret: "change-me-please-and-make-this-very-long-monitoring-secret-key"
    ttl-seconds: 86400   # 24 часа
  bootstrap-admin:
    enabled: true
    username: admin
    password: admin123
  metrics:
    # Сколько часов хранить time-series точки (старее — удаляются retention-задачей).
    retention-hours: 168   # 7 дней

logging:
  level:
    root: INFO
    ru.diplom.monitoring: DEBUG
    org.springframework.security: INFO

# =========================================================================
# Профили
# =========================================================================
---
spring:
  config:
    activate:
      on-profile: dev
  h2:
    console:
      enabled: true
  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: true

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/monitoring
    driver-class-name: org.postgresql.Driver
    username: monitoring
    password: monitoring
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
app:
  bootstrap-admin:
    enabled: false
